<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0b15">
<meta name="description" content="Duc Luance — Roblox, anime và những dự án sáng tạo.">
<title>Duc Luance</title>
<style>
:root{color-scheme:dark;--ink:#f7f1ff;--muted:#c4b8d3;--accent:#d9b6ff;--line:#ffffff25}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:2rem 1rem;font:1rem/1.6 system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 12% 14%,#3e2159 0,transparent 45%),radial-gradient(ellipse at 93% 91%,#27244b,transparent 43%),#0e0b15}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,#dac4fe55 1px,transparent 1.5px) 0 0/43px 43px;mask-image:linear-gradient(#000,transparent 82%)}
main{position:relative;width:min(100%,41rem);overflow:hidden;border:1px solid var(--line);border-radius:2rem;background:#100d18ed;box-shadow:0 30px 110px #0008}
.cover{height:10rem;position:relative;overflow:hidden;background:radial-gradient(ellipse at 70% 125%,#e4a1ff,transparent 57%),linear-gradient(117deg,#241931,#624284 65%,#20243b)}
.cover::before,.cover::after{content:"";position:absolute;inset:-90% -20%;background:repeating-radial-gradient(ellipse at 67% 79%,transparent 0 19px,#efe0ff55 20px 21px,transparent 22px 37px);transform:rotate(-19deg)}
.cover::after{opacity:.35;transform:rotate(-26deg) translateY(12px)}
.content{padding:0 clamp(1.15rem,5vw,2.6rem) 2rem}
.avatar{display:grid;place-items:center;position:relative;margin-top:-2.6rem;width:5.25rem;aspect-ratio:1;border:4px solid #100d18;border-radius:1.4rem;background:linear-gradient(145deg,#f2dfff,#ad75ef);color:#2a143c;font:900 1.65rem ui-monospace,monospace;box-shadow:0 7px 24px #0006}
h1{font-size:clamp(2.7rem,10vw,4.2rem);letter-spacing:-.075em;line-height:1.03;margin:.9rem 0 .3rem}
.handle{margin:0;color:var(--accent);font: .9rem ui-monospace,monospace}
.bio{max-width:35ch;color:var(--muted);margin:1rem 0 1.25rem}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;padding:0;margin:0;list-style:none}
.tags li{font-size:.875rem;padding:.2rem .65rem;border:1px solid var(--line);border-radius:2rem;color:#e8daf6}
.links{margin-top:1.65rem;display:grid;gap:.65rem}
.video{display:flex;align-items:center;gap:.85rem;padding:.75rem;text-decoration:none;color:inherit;background:#bd8af51a;border:1px solid #caa1ff55;border-radius:1rem;transition:background .2s,border-color .2s}
.video:hover{background:#bd8af535;border-color:var(--accent)}
.play{display:grid;place-items:center;flex:none;width:2.6rem;height:2.6rem;border-radius:.7rem;background:#d9b6ff;color:#251339;font-size:.95rem}
.video strong,.video small{display:block}.video small{font-size:.875rem;color:var(--muted)}
button{font:inherit;font-size:.875rem;color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:.7rem;padding:.45rem .8rem;justify-self:start;cursor:pointer}
button:hover{background:#ffffff12}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.status{font-size:.875rem;color:var(--muted);margin:0}.status:empty{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="cover" aria-hidden="true"></div>
  <div class="content">
    <div class="avatar" aria-hidden="true">DL</div>
    <h1>Duc Luance</h1>
    <p class="handle">@ducluance</p>
    <p class="bio">Mình thích làm game Roblox để chơi cùng bạn bè, thử làm hiệu ứng và kể chuyện anime bằng video ngắn.</p>
    <ul class="tags" aria-label="Sở thích"><li>Roblox dev</li><li>Anime</li><li>VFX</li></ul>
    <div class="links">
      <a class="video" href="https://www.youtube.com/shorts/4kvsQBQQFMo">
        <span class="play" aria-hidden="true">▶</span>
        <span><strong>YouTube Shorts</strong><small>Xem video</small></span>
      </a>
      <button type="button" id="copy" hidden>Sao chép link trang</button>
      <p class="status" role="status" id="status"></p>
    </div>
  </div>
</main>
<script>
const copy = document.querySelector('#copy');
const status = document.querySelector('#status');
if (navigator.clipboard?.writeText) {
  copy.hidden = false;
  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(location.origin + location.pathname);
      status.textContent = 'Đã sao chép link.';
    } catch {
      status.textContent = 'Bạn có thể sao chép link từ thanh địa chỉ.';
    }
  });
}
</script>
</body>
</html>
